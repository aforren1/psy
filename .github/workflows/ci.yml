name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository; artifacts need no repo scope.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------- #
  # Headers: CMake builds every registered header's compile checks (C11,  #
  # C++17, no-threads, async), the tests/adapt/ tests and the examples,   #
  # warnings as errors, on all three platforms. ctest runs the checks and #
  # the tests. CMakeLists.txt decides which headers apply to which OS.    #
  # --------------------------------------------------------------------- #
  headers:
    name: Headers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # On Linux only, also fetch Tracy and build psy_rt.h's PSYRT_TRACY
      # compile check against the real TracyC.h.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPSY_FETCH_MINIAUDIO=ON -DPSY_FETCH_PL_MPEG=ON ${{ matrix.os == 'ubuntu-latest' && '-DPSY_TRACY_CHECK=ON' || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Compile checks
        run: ctest --test-dir build -C Release --output-on-failure

      # tests/loopback/ needs two device names wired together, so CI can never
      # run it. Build it on one platform anyway, or it rots unnoticed.
      - name: Build loopback tests (build only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -B build-loopback -DCMAKE_BUILD_TYPE=Release -DPSY_BUILD_LOOPBACK=ON -DPSY_FETCH_MINIAUDIO=ON
          cmake --build build-loopback

      # No hardware on CI. Each example must fail with its documented exit
      # code, not crash: a SIGSEGV or 0xC0000005 is a different number.
      - name: Run examples
        shell: bash
        run: |
          set -u
          if [ "$RUNNER_OS" = Windows ]; then bin=build/Release; else bin=build; fi
          # The runner's bash has -e set, so the expected nonzero exit must be
          # observed inside an `if`, where -e does not apply.
          expect() {
            local want=$1; shift
            local got=0
            if "$@"; then got=0; else got=$?; fi
            if [ "$got" -ne "$want" ]; then echo "::error::$* exited $got, expected $want"; exit 1; fi
          }
          if [ "$RUNNER_OS" != macOS ]; then
            expect 1 "$bin/parallel_trigger"           # no port: open fails
          fi
          expect 2 "$bin/serial_trigger"               # no args: usage
          expect 1 "$bin/serial_trigger" /dev/nothing  # open fails
          # rt_jitter needs no hardware and no privilege: a refused real-time
          # policy is one of its results, so it always exits 0. 40 short waits
          # per spin window keeps a loaded CI runner under a second.
          expect 0 "$bin/rt_jitter" 40 1000
          # rt_pump runs a fake inference job beside a 16 ms frame loop; 40
          # frames is under a second and needs nothing.
          expect 0 "$bin/rt_pump" 40
          # The event ring: a 30-frame CSV log, and a short benchmark run.
          expect 0 "$bin/rt_ring_csv" 30 rt_ring.csv
          expect 0 "$bin/rt_ring_bench" 100000 2 200
          # The adaptive-method examples simulate their observer, so they
          # need nothing and exit 0. The benches print their own numbers.
          expect 0 "$bin/stair_sim"
          expect 0 "$bin/quest_sim"
          expect 0 "$bin/quest_qcsf"
          expect 0 "$bin/quest_bench"
          expect 0 "$bin/quest_async" 20 1      # 20 trials, one frame each
          expect 0 "$bin/gp_sim"
          expect 0 "$bin/gp_bench"
          expect 0 "$bin/gp_audiometric"   # no args: the small configuration
          expect 0 "$bin/gp_async"
          expect 0 "$bin/gp_optimize"
          expect 0 "$bin/gp_pairwise"
          # The trial sequencer's examples simulate their observer.
          expect 0 "$bin/trials_mocs"
          expect 0 "$bin/trials_interleave"
          # The timeline's examples simulate their display.
          expect 0 "$bin/timeline_trial"
          expect 0 "$bin/timeline_tracking"    # checks its own errors
          expect 0 "$bin/timeline_bench" 500   # a 2 ms frame budget
          # The color example on its nominal display; color_bench is built, not run.
          expect 0 "$bin/color_convert"
          expect 2 "$bin/color_convert" a b    # usage
          # The audio example on miniaudio's null device: no sound hardware.
          expect 0 "$bin/audio_tone" --null
          expect 2 "$bin/audio_tone" --bogus

  # --------------------------------------------------------------------- #
  # Extra Linux toolchains and flag sets, one matrix entry each:           #
  #   clang        - a second compiler; the headers are warning-free on    #
  #                  both or the build fails (-Werror).                    #
  #   sanitizers   - ASan + UBSan over the compile checks and the          #
  #                  examples, which is where the OS calls actually run.   #
  #   nothreads-cxx- the PSY<X>_NO_THREADS path as C++17. CMake builds it  #
  #                  as C only, and the defines reach the .cpp compile     #
  #                  checks through CMAKE_CXX_FLAGS without a new target.  #
  #                  A transport macro also sets PSYRT_NO_THREADS, but a   #
  #                  command-line define reaches psy_rt.h first in the     #
  #                  compile check that includes it directly, so name all  #
  #                  three: define both of a pair, or neither.             #
  # --------------------------------------------------------------------- #
  linux-extra:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang
            cc: clang
            cxx: clang++
            cflags: ""
            cxxflags: ""
          - name: sanitizers
            cc: gcc
            cxx: g++
            cflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            cxxflags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          - name: nothreads-cxx
            cc: gcc
            cxx: g++
            cflags: ""
            cxxflags: "-DPSYS_NO_THREADS -DPSYP_NO_THREADS -DPSYRT_NO_THREADS"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # A sanitizer report must not be mistaken for an example's documented
      # exit code (1 and 2 are both expected results below), so give it a
      # number of its own. halt_on_error makes UBSan stop instead of logging.
      ASAN_OPTIONS: exitcode=42
      LSAN_OPTIONS: exitcode=42
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:exitcode=42
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DPSY_FETCH_MINIAUDIO=ON -DPSY_FETCH_PL_MPEG=ON \
            -DCMAKE_C_FLAGS="${{ matrix.cflags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"

      - name: Build
        run: cmake --build build

      - name: Compile checks
        run: ctest --test-dir build --output-on-failure

      - name: Run examples
        if: matrix.name == 'sanitizers'
        shell: bash
        run: |
          set -u
          expect() {
            local want=$1; shift
            local got=0
            if "$@"; then got=0; else got=$?; fi
            if [ "$got" -ne "$want" ]; then echo "::error::$* exited $got, expected $want"; exit 1; fi
          }
          expect 1 build/parallel_trigger           # no port: open fails
          expect 2 build/serial_trigger             # no args: usage
          expect 1 build/serial_trigger /dev/nothing
          expect 0 build/rt_jitter 40 1000
          expect 0 build/rt_pump 40
          expect 0 build/rt_ring_csv 30 rt_ring.csv
          # The adaptive examples' numerics run instrumented through the
          # tests/adapt/ programs under ctest above; the two cheap examples
          # cover the example code itself. gp_sim and the benches are too
          # slow under ASan in Debug to be worth a second run.
          expect 0 build/stair_sim
          expect 0 build/quest_sim
          expect 0 build/quest_async 20 1
          expect 0 build/trials_mocs
          expect 0 build/trials_interleave
          expect 0 build/timeline_trial
          expect 0 build/timeline_tracking
          expect 0 build/color_convert
          expect 0 build/audio_tone --null

  # --------------------------------------------------------------------- #
  # MinGW: the headers carry explicit MinGW handling (no #pragma           #
  # comment(lib), its own intrinsics), which no other job compiles. Build  #
  # the compile checks only; the examples are covered elsewhere.           #
  # --------------------------------------------------------------------- #
  mingw:
    name: MinGW (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Before checkout: every `run` below uses the shell it installs.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake

      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DPSY_BUILD_EXAMPLES=OFF -DPSY_FETCH_MINIAUDIO=ON -DPSY_FETCH_PL_MPEG=ON

      - name: Build compile checks
        run: cmake --build build

      - name: Compile checks
        run: ctest --test-dir build --output-on-failure

  # --------------------------------------------------------------------- #
  # WebAssembly: the computation headers (stair, quest, gp, trials,        #
  # timeline, color)                                                       #
  # claim to need nothing but libm, and psy_rt.h claims a platform branch  #
  # is all wasm needs. Compile the compile checks with emcc, threads off,  #
  # and run them under node. Nothing here is a timing claim.               #
  # --------------------------------------------------------------------- #
  wasm:
    name: WebAssembly (emscripten)
    runs-on: ubuntu-latest
    # The same image the headers were checked in locally, so the two runs
    # are the same toolchain.
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile checks and tests under emcc
        shell: bash
        run: |
          set -eu
          # The handles are large and the tests keep them on the stack, so
          # give wasm a real stack, and an initial memory that holds it;
          # growth covers the arenas. With -pthread emcc turns its growth
          # advisory into an error under -Werror, hence the -Wno.
          W="-O2 -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Werror -I. -sSTACK_SIZE=16MB -sINITIAL_MEMORY=64MB -sALLOW_MEMORY_GROWTH=1 -Wno-pthreads-mem-growth"
          T="-pthread -sPROXY_TO_PTHREAD=1 -sEXIT_RUNTIME=1"
          # psy_rt.h: with threads (the pump and the worker run under node),
          # without (they refuse to start, and say so), and compiled out.
          emcc $W $T -o rt_c.js tests/compile/psy_rt.c && node rt_c.js
          emcc $W    -o rt_nothr.js tests/compile/psy_rt.c && node rt_nothr.js
          emcc $W -DPSYRT_NO_THREADS -o rt_off.js tests/compile/psy_rt.c && node rt_off.js
          emcc $W $T -o rt_test.js tests/adapt/psy_rt_test.c && node rt_test.js
          emcc $W $T -o rt_pump.js examples/rt_pump.c && node rt_pump.js 40
          emcc $W $T -o rt_ring_csv.js examples/rt_ring_csv.c && node rt_ring_csv.js 30 > /dev/null
          for h in stair quest gp trials timeline color; do
            emcc $W -o "compile_$h.js" "tests/compile/psy_$h.c" && node "compile_$h.js"
            emcc $W -o "test_$h.js" "tests/adapt/psy_${h}_test.c" && node "test_$h.js"
          done
          # The async layers on the pump, the point of the psy_rt.h branch.
          emcc $W $T -DPSYQ_ASYNC  -o test_quest_async.js tests/adapt/psy_quest_test.c && node test_quest_async.js
          emcc $W $T -DPSYGP_ASYNC -o test_gp_async.js    tests/adapt/psy_gp_test.c    && node test_gp_async.js
          # psy_audio.h: the core test runs (it has a device thread); the
          # header with miniaudio's Web Audio backend is compiled, not run,
          # because node has no Web Audio. miniaudio's EM_ASM needs -std=gnu11.
          emcc $W $T -o test_audio.js tests/adapt/psy_audio_test.c && node test_audio.js
          curl -sL -o miniaudio.h https://raw.githubusercontent.com/mackron/miniaudio/0.11.25/miniaudio.h
          echo "ac7af4de748b7e26b777f37e01cee313a308a7296a3eb080e2906b320cc55c89  miniaudio.h" | sha256sum -c -
          emcc -O2 -std=gnu11 -Wall -Wextra -Wpedantic -Wshadow -Werror -I. -c -o compile_audio.o tests/compile/psy_audio.c
          # psy_gfx.h without SDL: the compile check on the simulated display
          # and the test's CPU half run; node has no GL, so its GL half says so.
          emcc $W -DPSYSCR_NO_SDL -o compile_gfx.js tests/compile/psy_gfx.c && node compile_gfx.js
          emcc $W -o test_gfx.js tests/adapt/psy_gfx_test.c && node test_gfx.js
          # psy_video.h on the simulated display: with a decode thread, without
          # one (it decodes inside the frame call), and with pl_mpeg compiled.
          emcc $W $T -DPSYSCR_NO_SDL -DPSYVID_NO_PL_MPEG -o compile_video.js tests/compile/psy_video.c && node compile_video.js
          emcc $W -DPSYSCR_NO_SDL -DPSYVID_NO_PL_MPEG -o compile_video_inline.js tests/compile/psy_video.c && node compile_video_inline.js
          emcc $W $T -o test_video.js tests/adapt/psy_video_test.c && node test_video.js
          curl -sL -o pl_mpeg.h https://raw.githubusercontent.com/phoboslab/pl_mpeg/c871f2be022ece7ef4f64230b4fb8e1fb9eb6023/pl_mpeg.h
          echo "3a8cb30c83c2a1147719c30fe0c8b93da2987aa43140077c575b39aaa75fc2c9  pl_mpeg.h" | sha256sum -c -
          emcc -O2 -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Werror -I. -DPSYSCR_NO_SDL -c -o compile_video_plm.o tests/compile/psy_video.c

  # --------------------------------------------------------------------- #
  # Python: cibuildwheel builds one abi3 wheel (Limited API, cp38+) per     #
  # platform for each binding package. Add a directory to the matrix when  #
  # a binding lands; exclude the platforms its header does not support.    #
  # --------------------------------------------------------------------- #
  python-wheels:
    name: Python ${{ matrix.package }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [psy_parallel, psy_serial, psy_stair, psy_quest, psy_gp, psy_trials, psy_color]
        exclude:
          - os: macos-latest      # psy_parallel.h #errors on macOS
            package: psy_parallel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # cibuildwheel builds from the package directory alone, so every header
      # the extension compiles must sit next to setup.py: the package's header
      # and psy_rt.h, which the transport headers include and the adaptive
      # headers' async layers include. psy_stair gets a psy_rt.h it never
      # reads; staging it unconditionally keeps this step one line.
      - name: Stage headers into the package (isolated build needs them locally)
        shell: bash
        run: cp ${{ matrix.package }}.h psy_rt.h bindings/python/${{ matrix.package }}/

      - name: Build & test wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: bindings/python/${{ matrix.package }}
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.os }}
          path: wheelhouse/*.whl

  # --------------------------------------------------------------------- #
  # Octave: build every MEX with mkoctfile and smoke-test.                #
  # --------------------------------------------------------------------- #
  octave-mex:
    name: Octave 7.3 MEX
    runs-on: ubuntu-latest
    # Pin Octave 7.3.0 via Debian bookworm (the target version). This is also
    # deterministic and avoids the liboctave-dev -> octave-dev package rename
    # that newer distros made (octave-dev is correct on bookworm and noble).
    container: debian:bookworm
    steps:
      - name: Install Octave 7.3 + build tools
        run: |
          apt-get update
          # ca-certificates is required for actions/checkout's HTTPS git fetch
          # (the bare bookworm image has none, and --no-install-recommends would
          # not pull it in transitively).
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential octave octave-dev
          octave-cli --version | head -1

      - uses: actions/checkout@v7

      - name: Build MEX
        working-directory: bindings/mex
        run: octave-cli -q --eval "build"

      # The runner has no parallel or serial hardware, so both opens must fail.
      # Check the identifier, not just that something was raised: a bad
      # argument, a bad handle or a crash in the dispatcher would otherwise
      # pass for the expected failure.
      - name: Smoke test (list ports; open is expected to fail on CI)
        working-directory: bindings/mex
        run: |
          octave-cli -q --eval "
            % Both MEX files build on psy_rt.h, so both read one clock.
            % A gap of seconds would mean two clocks, not a slow runner.
            ts = psy_serial('now_us');
            tp = psy_parallel('now_us');
            printf('library clock: %.0f us (serial), %.0f us (parallel)\n', ts, tp);
            if abs(tp - ts) > 1e6
              error('psy:smoke', 'the two MEX clocks disagree by %.0f us', tp - ts);
            end
            ports = psy_parallel('list');
            printf('detected %d parallel port(s)\n', numel(ports));
            opened = false;
            try
              h = psy_parallel('open');
              psy_parallel('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'psy_parallel:open')
                error('psy:smoke', 'expected psy_parallel:open, got ''%s'': %s', e.identifier, e.message);
              end
              printf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            ports = psy_serial('list');
            printf('detected %d serial port(s)\n', numel(ports));
            opened = false;
            try
              h = psy_serial('open', '/dev/nothing');
              psy_serial('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'psy_serial:open')
                error('psy:smoke', 'expected psy_serial:open, got ''%s'': %s', e.identifier, e.message);
              end
              printf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            accepted = false;
            try
              psy_serial('read', uint64(123456), 1, 0);
              accepted = true;
            catch e
              if ~strcmp(e.identifier, 'psy_serial:handle')
                error('psy:smoke', 'expected psy_serial:handle, got ''%s''', e.identifier);
              end
              printf('unknown handle rejected: %s\n', e.message);
            end
            if accepted, error('psy:smoke', 'an unknown handle was accepted'); end"

      # The four adaptive bindings simulate their observers, so their test
      # script needs no hardware. Locally it passes in Octave 10 and MATLAB
      # R2023a (bindings/mex/README.md); this runs it on the pinned 7.3.
      - name: Adaptive bindings test (test_mex.m)
        working-directory: bindings/mex
        run: octave-cli -q --eval "test_mex"

      - name: Color binding test (test_mex_color.m)
        working-directory: bindings/mex
        run: octave-cli -q --eval "test_mex_color"

      - uses: actions/upload-artifact@v7
        with:
          name: octave-mex-bookworm
          path: bindings/mex/psy_*.mex*

  # --------------------------------------------------------------------- #
  # MATLAB: install MATLAB, build every MEX, and smoke-test.              #
  # https://github.com/matlab-actions                                     #
  # --------------------------------------------------------------------- #
  # MathWorks licenses MATLAB on hosted runners for public repositories with
  # no setup. A private fork fails here with "Unable to find a license" and
  # needs a batch licensing token in the MLM_LICENSE_TOKEN secret
  # (https://www.mathworks.com/help/install/ug/matlab-batch-licensing-token.html).
  matlab-mex:
    name: MATLAB MEX
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Build MEX + smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath('bindings/mex');
            build;
            % Both MEX files build on psy_rt.h, so both read one clock.
            % A gap of seconds would mean two clocks, not a slow runner.
            ts = psy_serial('now_us');
            tp = psy_parallel('now_us');
            fprintf('library clock: %.0f us (serial), %.0f us (parallel)\n', ts, tp);
            if abs(tp - ts) > 1e6
              error('psy:smoke', 'the two MEX clocks disagree by %.0f us', tp - ts);
            end
            ports = psy_parallel('list');
            fprintf('detected %d parallel port(s)\n', numel(ports));
            % Check the identifier, not just that something was raised: a bad
            % argument or a crash in the dispatcher would otherwise pass for
            % the expected no-hardware failure.
            opened = false;
            try
              h = psy_parallel('open');
              psy_parallel('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'psy_parallel:open')
                error('psy:smoke', 'expected psy_parallel:open, got ''%s'': %s', e.identifier, e.message);
              end
              fprintf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            ports = psy_serial('list');
            fprintf('detected %d serial port(s)\n', numel(ports));
            opened = false;
            try
              h = psy_serial('open', '/dev/nothing');
              psy_serial('close', h);
              opened = true;
            catch e
              if ~strcmp(e.identifier, 'psy_serial:open')
                error('psy:smoke', 'expected psy_serial:open, got ''%s'': %s', e.identifier, e.message);
              end
              fprintf('open failed as expected on CI: %s\n', e.message);
            end
            if opened, disp('opened OK (hardware present)'); end
            accepted = false;
            try
              psy_serial('read', uint64(123456), 1, 0);
              accepted = true;
            catch e
              if ~strcmp(e.identifier, 'psy_serial:handle')
                error('psy:smoke', 'expected psy_serial:handle, got ''%s''', e.identifier);
              end
              fprintf('unknown handle rejected: %s\n', e.message);
            end
            if accepted, error('psy:smoke', 'an unknown handle was accepted'); end

      - name: Adaptive bindings test (test_mex.m)
        uses: matlab-actions/run-command@v3
        with:
          command: cd('bindings/mex'); test_mex

      - name: Color binding test (test_mex_color.m)
        uses: matlab-actions/run-command@v3
        with:
          command: cd('bindings/mex'); test_mex_color

      - uses: actions/upload-artifact@v7
        with:
          name: matlab-mex-linux
          path: bindings/mex/psy_*.mex*

  # --------------------------------------------------------------------- #
  # psy_screen.h: the one header with an external dependency, SDL3. The   #
  # headers job builds only its SDL-free test; this job gets SDL3 3.4.0   #
  # pinned (Windows: the release zips, checked by SHA-256; Linux and      #
  # macOS: the release-3.4.0 tag, built once and cached) and builds the   #
  # compile checks, the test and the examples, and on Windows the MinGW   #
  # compile checks too. No runner has a display worth timing, so the      #
  # examples run on the simulated display. psy_gfx.h, on psy_screen.h,    #
  # builds here too, and its pixel test renders offscreen on software GL: #
  # Mesa llvmpipe on Linux, ANGLE's WARP and SwiftShader on Windows (from #
  # a pinned Electron zip, checked by SHA-256, cached). Nothing here is a  #
  # timing claim.                                                         #
  # --------------------------------------------------------------------- #
  screen:
    name: Screen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VERSION: 3.4.0
      ELECTRON_VERSION: v38.8.6   # ANGLE 2.1.25848 (git 85cc0e0b9cc3)
    steps:
      - uses: actions/checkout@v7

      # psy_gfx.h's test loads EGL at run time: Mesa's, with llvmpipe.
      - name: Mesa EGL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: ANGLE cache (Windows)
        if: runner.os == 'Windows'
        id: anglecache
        uses: actions/cache@v4
        with:
          path: ~/angle
          key: angle-electron-${{ env.ELECTRON_VERSION }}-v1

      - name: ANGLE (Windows, from the Electron release zip by checksum)
        if: runner.os == 'Windows' && steps.anglecache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eu
          curl -sfLo electron.zip "https://github.com/electron/electron/releases/download/$ELECTRON_VERSION/electron-$ELECTRON_VERSION-win32-x64.zip"
          echo "366ae2b4aa9e6bc89b98c8b5831d46303e45cd49b2970c2b3921de5f2fcfc2e1  electron.zip" | sha256sum -c -
          unzip -q -o electron.zip libEGL.dll libGLESv2.dll d3dcompiler_47.dll vk_swiftshader.dll vk_swiftshader_icd.json vulkan-1.dll -d ~/angle
          rm electron.zip

      - name: ANGLE path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "PSYSCR_ANGLE_DIR=$(cygpath -w ~/angle)" >> "$GITHUB_ENV"
          echo "PSYGFX_TEST_DEVICES=warp,swiftshader" >> "$GITHUB_ENV"

      - name: SDL3 (Windows, release zips by checksum)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          base=https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION
          curl -sfLo sdl-vc.zip "$base/SDL3-devel-$SDL_VERSION-VC.zip"
          curl -sfLo sdl-mingw.zip "$base/SDL3-devel-$SDL_VERSION-mingw.zip"
          echo "4489ba0070b8ce047b8717e4b71fa7e35ac71362e7a6bb2a90a7a27f624b3d5d  sdl-vc.zip" | sha256sum -c -
          echo "ac22b9b0556e2f59059c9219245cd0bf73fdef4c5c4b35a601d9dc85c72661ea  sdl-mingw.zip" | sha256sum -c -
          unzip -q sdl-vc.zip -d "$RUNNER_TEMP/vc"
          unzip -q sdl-mingw.zip -d "$RUNNER_TEMP/mingw"
          echo "SDL3_DIR=$RUNNER_TEMP/vc/SDL3-$SDL_VERSION/cmake" >> "$GITHUB_ENV"
          echo "SDL3_MINGW=$RUNNER_TEMP/mingw/SDL3-$SDL_VERSION/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      - name: SDL3 cache (Linux, macOS)
        if: runner.os != 'Windows'
        id: sdlcache
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1

      # A console build on Linux: the checks and the simulated display need no
      # X11 or Wayland, and the runner has neither's development packages.
      - name: SDL3 (Linux, macOS, tag release-3.4.0)
        if: runner.os != 'Windows' && steps.sdlcache.outputs.cache-hit != 'true'
        run: |
          set -eu
          git clone --depth 1 --branch "release-$SDL_VERSION" https://github.com/libsdl-org/SDL.git sdl-src
          extra=""
          if [ "$RUNNER_OS" = Linux ]; then extra="-DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON"; fi
          cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" $extra
          cmake --build sdl-build -j4
          cmake --install sdl-build

      - name: SDL3 path (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          echo "SDL3_DIR=$HOME/sdl3/lib/cmake/SDL3" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/sdl3/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/sdl3/lib" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL3_DIR="$SDL3_DIR" -DPSY_BUILD_LOOPBACK=ON -DPSY_FETCH_PL_MPEG=ON

      - name: Build
        run: cmake --build build --config Release --target compile_psy_screen_c compile_psy_screen_cxx compile_psy_screen_com test_psy_screen screen_hello screen_flipstats screen_input screen_abort psy_screen_loopback compile_psy_gfx_c compile_psy_gfx_cxx test_psy_gfx gfx_hello gfx_trial gfx_load gfx_calib gfx_bench gfx_gallery compile_psy_video_c compile_psy_video_cxx compile_psy_video_com test_psy_video video_play video_bench

      # psy_gfx.h's pixel checks must run where software GL exists; macOS has
      # no EGL, so its test runs the CPU checks only.
      - name: Compile checks and test
        shell: bash
        run: |
          if [ "$RUNNER_OS" != macOS ]; then export PSYGFX_TEST_REQUIRE_GL=1; fi
          ctest --test-dir build -C Release -R "screen|gfx|video" --output-on-failure

      - name: Run examples (simulated display)
        shell: bash
        run: |
          set -u
          if [ "$RUNNER_OS" = Windows ]; then bin=build/Release; else bin=build; fi
          expect() {
            local want=$1; shift
            local got=0
            if "$@"; then got=0; else got=$?; fi
            if [ "$got" -ne "$want" ]; then echo "::error::$* exited $got, expected $want"; exit 1; fi
          }
          expect 0 "$bin/screen_hello" --sim
          expect 0 "$bin/screen_flipstats" --sim --frames 120
          expect 2 "$bin/screen_hello" --bogus
          expect 2 "$bin/psy_screen_loopback"       # no args: usage
          # psy_gfx.h on the simulated display: its null backend draws nothing.
          expect 0 "$bin/gfx_hello" --sim --frames 30
          expect 0 "$bin/gfx_trial" --sim
          expect 0 "$bin/gfx_load" --sim --gabors 10 --dots 100 --seconds 1
          expect 0 "$bin/gfx_calib"                 # no args: the synthetic display
          expect 0 "$bin/gfx_gallery" --sim         # each page once; 1 if a tile's draw is refused
          expect 2 "$bin/gfx_gallery" --page 9
          expect 2 "$bin/gfx_hello" --bogus
          expect 2 "$bin/gfx_bench" --device bogus
          # psy_video.h: a generated frame sequence, plain, QOI and I420.
          expect 0 "$bin/video_play" --sim
          expect 0 "$bin/video_play" --sim --qoi --frames 20
          expect 0 "$bin/video_play" --sim --yuv --size 64x48 --frames 20
          expect 0 "$bin/video_bench" --size 64x48 --reps 3
          expect 2 "$bin/video_play" --bogus

      # The runner's MinGW-w64 gcc, warnings as errors, on the same sources.
      - name: MinGW compile checks (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          export PATH="/c/mingw64/bin:$PATH"
          W="-Wall -Wextra -Wpedantic -Wshadow -Werror -O2 -I. -I$SDL3_MINGW/include"
          gcc -std=c11 $W -o mingw_c.exe tests/compile/psy_screen.c -L"$SDL3_MINGW/lib" -lSDL3
          g++ -std=c++17 $W -o mingw_cxx.exe tests/compile/psy_screen.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_test.exe tests/adapt/psy_screen_test.c
          g++ -std=c++17 $W -o mingw_com.exe tests/compile/psy_screen_com.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_gfx_c.exe tests/compile/psy_gfx.c -L"$SDL3_MINGW/lib" -lSDL3
          g++ -std=c++17 $W -o mingw_gfx_cxx.exe tests/compile/psy_gfx.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_gfx_test.exe tests/adapt/psy_gfx_test.c
          cp "$SDL3_MINGW/bin/SDL3.dll" .
          ./mingw_c.exe && ./mingw_cxx.exe && ./mingw_test.exe && ./mingw_com.exe
          ./mingw_gfx_c.exe && ./mingw_gfx_cxx.exe && PSYGFX_TEST_REQUIRE_GL=1 ./mingw_gfx_test.exe
          gcc -std=c11 $W -DPSYVID_NO_PL_MPEG -o mingw_video_c.exe tests/compile/psy_video.c -L"$SDL3_MINGW/lib" -lSDL3
          g++ -std=c++17 $W -DPSYVID_NO_PL_MPEG -o mingw_video_cxx.exe tests/compile/psy_video.cpp -L"$SDL3_MINGW/lib" -lSDL3
          gcc -std=c11 $W -o mingw_video_test.exe tests/adapt/psy_video_test.c
          ./mingw_video_c.exe && ./mingw_video_cxx.exe && ./mingw_video_test.exe
